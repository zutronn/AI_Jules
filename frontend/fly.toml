# fly.toml app configuration file generated for lawliet-labs-frontend on 2026-04-03T10:47:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-jules'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
