<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lawliet studios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
    // Inject "AI Tokens" and "Polymarket" nav links into the React app's header
    var _navRetries = 0;
    var _navMaxRetries = 20;
    function injectNavLinks() {
      var hasTokens = document.getElementById('tokens-nav-link');
      var hasPoly = document.getElementById('polymarket-nav-link');
      if (hasTokens && hasPoly) return;
      var nav = document.querySelector('header nav') || document.querySelector('nav');
      if (!nav) {
        if (++_navRetries < _navMaxRetries) setTimeout(injectNavLinks, 500);
        return;
      }
      var links = nav.querySelectorAll('a');
      var insertBefore = null;
      for (var i = 0; i < links.length; i++) {
        if (links[i].textContent.trim() === 'Sign In') { insertBefore = links[i]; break; }
      }
      if (!hasTokens) {
        var tokenLink = document.createElement('a');
        tokenLink.id = 'tokens-nav-link';
        tokenLink.href = '/tokens/index.html';
        tokenLink.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#ea580c;transition:color 0.2s;';
        tokenLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M6 12h12"/></svg> AI Tokens';
        if (insertBefore) { nav.insertBefore(tokenLink, insertBefore); } else { nav.appendChild(tokenLink); }
      }
      if (!hasPoly) {
        var polyLink = document.createElement('a');
        polyLink.id = 'polymarket-nav-link';
        polyLink.href = '/polymarket/index.html';
        polyLink.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#2563eb;transition:color 0.2s;';
        polyLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg> Polymarket';
        var signIn = null;
        var allLinks = nav.querySelectorAll('a');
        for (var j = 0; j < allLinks.length; j++) {
          if (allLinks[j].textContent.trim() === 'Sign In') { signIn = allLinks[j]; break; }
        }
        if (signIn) { nav.insertBefore(polyLink, signIn); } else { nav.appendChild(polyLink); }
      }
    }
    setTimeout(injectNavLinks, 1000);
    var _navObserver = new MutationObserver(function() {
      if (!document.getElementById('tokens-nav-link') || !document.getElementById('polymarket-nav-link')) injectNavLinks();
    });
    _navObserver.observe(document.body, { childList: true, subtree: true });
  </script>

  <!-- Health monitor is rendered by React App.tsx from /api/ai/status (real-time data) -->

  <!-- Inject profile links on agent names inside arena cards -->
  <script>
    var _agentProfileMap = {
      'ChatGPT': '/agents/chatgpt/index.html',
      'Perplexity': '/agents/perplexity/index.html',
      'Grok': '/agents/grok/index.html',
      'DeepSeek': '/agents/deepseek/index.html',
      'Minimax': '/agents/minimax/index.html'
    };
    var _agentNames = Object.keys(_agentProfileMap);
    function injectArenaProfileLinks() {
      var arenaCards = document.querySelectorAll('a[href^="/arena/"]');
      arenaCards.forEach(function(card) {
        var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
        var node;
        var matches = [];
        while (node = walker.nextNode()) {
          var text = node.textContent.trim();
          for (var i = 0; i < _agentNames.length; i++) {
            if (text === _agentNames[i] || text.indexOf(_agentNames[i]) === 0) {
              matches.push({ textNode: node, agentName: _agentNames[i] });
              break;
            }
          }
        }
        matches.forEach(function(m) {
          var parent = m.textNode.parentElement;
          if (!parent || parent.querySelector('.arena-profile-link')) return;
          var link = document.createElement('a');
          link.href = _agentProfileMap[m.agentName];
          link.className = 'arena-profile-link';
          link.style.cssText = 'font-size:9px;color:#ea580c;font-weight:700;margin-left:6px;text-decoration:none;z-index:10;position:relative;';
          link.textContent = '\u2197 Profile';
          link.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            window.location.href = this.href;
          });
          parent.appendChild(link);
        });
      });
    }
    setTimeout(injectArenaProfileLinks, 2500);
    var _arenaObserver = new MutationObserver(function() {
      injectArenaProfileLinks();
    });
    _arenaObserver.observe(document.body, { childList: true, subtree: true });
  </script>
  </body>
</html>
