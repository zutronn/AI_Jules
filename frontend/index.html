<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lawliet studios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
    // Inject "AI Tokens" nav link into the React app's header
    var _tokenRetries = 0;
    var _tokenMaxRetries = 20;
    function injectTokensLink() {
      if (document.getElementById('tokens-nav-link')) return;
      var nav = document.querySelector('header nav') || document.querySelector('nav');
      if (!nav) {
        if (++_tokenRetries < _tokenMaxRetries) setTimeout(injectTokensLink, 500);
        return;
      }
      var links = nav.querySelectorAll('a');
      var insertBefore = null;
      for (var i = 0; i < links.length; i++) {
        if (links[i].textContent.trim() === 'Sign In') { insertBefore = links[i]; break; }
      }
      var tokenLink = document.createElement('a');
      tokenLink.id = 'tokens-nav-link';
      tokenLink.href = '/tokens/index.html';
      tokenLink.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#ea580c;transition:color 0.2s;';
      tokenLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M6 12h12"/></svg> AI Tokens';
      if (insertBefore) {
        nav.insertBefore(tokenLink, insertBefore);
      } else {
        nav.appendChild(tokenLink);
      }
    }
    setTimeout(injectTokensLink, 1000);
    var _tokenObserver = new MutationObserver(function() {
      if (!document.getElementById('tokens-nav-link')) injectTokensLink();
    });
    _tokenObserver.observe(document.body, { childList: true, subtree: true });
  </script>
  </body>
</html>
